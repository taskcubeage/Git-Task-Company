name: Promote Development to Testing

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge development into testing
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git remote add company https://x-access-token:${PAT_TOKEN}@github.com/taskcubeage/Git-Task-Company.git

          git fetch company

          git checkout -B testing company/testing

          git merge company/development

          git push company testing